title: "Yu Xi Chau"
tagline: "AI systems, governance & engineering notes"
name: "Yu Xi Chau"
description: "Yu Xi Chau builds efficient AI systems that organizations can use, govern, and trust. Writing and interactive projects on AI systems, governance, and application."
url: "https://yuxichau.com"
baseurl: ""
lang: en

# Site Author
author:
  name: "Yu Xi Chau"
  avatar: "/assets/images/bio-photo-20260912.png"
  bio: "Building efficient AI systems that organizations can use, govern, and trust."
  location: "Hong Kong"
  github: "https://github.com/yuxichau"
  linkedin: "https://www.linkedin.com/in/yuxichau/"

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Include files/folders
include:
  - _pages
  - _redirects
  - llms.txt

# Exclude non-site files
exclude:
  - Makefile
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - _scripts/
  - docs/
  - .playwright-mcp/

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      permalink: /posts/:title/
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single

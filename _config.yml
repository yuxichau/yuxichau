title: "Yu Xi Chau"
description: My professional website and blog
url: "https://yuxichau.com"
baseurl: ""
logo: "assets/images/logo.png"
favicon: "assets/images/favicon.svg" 


# Theme
theme: minimal-mistakes-jekyll
minimal_mistakes_skin: "air" # "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise"

# Site Author
author:
  name: "Yu Xi Chau"
  avatar: "/assets/images/bio-photo.png" # Optional
  bio: "Data Scientist and Generative AI Lead. I build GenAI applications and set up AI governance at FWD Insurance."
  location: "Hong Kong"
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/yuxichau/"
    - label: "Website"
      icon: "fas fa-fw fa-link"
      url: "https://yuxichau.com"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/yuxichau"


# Build settings
markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-include-cache

# Include files/folders
include: ["_pages", "_redirects"]

# Pagination
paginate: 5
paginate_path: /page:num/

# Defaults
tag_archive:
  type: Liquid
  path: /tags/

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
      permalink: /posts/:title/
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

# Main navigation lives in _data/navigation.yml (single source of truth)

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-github"
      url: "https://github.com/yuxichau"
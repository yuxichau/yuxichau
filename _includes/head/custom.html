<link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/images/favicon.svg' | relative_url }}">
<meta property="og:image" content="{{ '/assets/images/bio-photo-20260912.png' | absolute_url }}">
<meta name="twitter:card" content="summary_large_image">
<script type="application/ld+json">{
  "@context":"https://schema.org",
  "@type":"Person",
  "name":"Yu Xi Chau",
  "url":"https://yuxichau.com/about/",
  "image":"https://yuxichau.com/assets/images/bio-photo-20260912.png",
  "sameAs":["https://github.com/yuxichau","https://www.linkedin.com/in/yuxichau/"]
}</script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var toggle = document.querySelector('.greedy-nav__toggle');
  var nav = document.getElementById('site-nav');
  var menu = nav && nav.querySelector('.hidden-links');
  if (!toggle || !nav || !menu) return;
  menu.id = 'site-nav-links';
  toggle.setAttribute('aria-controls', 'site-nav-links');
  toggle.setAttribute('aria-expanded', 'false');
  var setOpen = function (open) {
    toggle.setAttribute('aria-expanded', String(open));
    menu.classList.toggle('hidden', !open);
    menu.classList.toggle('is-open', open);
    if (open) { var first = menu.querySelector('a'); if (first) first.focus(); }
    else toggle.focus();
  };
  toggle.addEventListener('click', function () { setOpen(toggle.getAttribute('aria-expanded') !== 'true'); });
  document.addEventListener('keydown', function (event) { if (event.key === 'Escape' && toggle.getAttribute('aria-expanded') === 'true') setOpen(false); });
  menu.addEventListener('click', function (event) { if (event.target.closest('a') && window.innerWidth < 1024) setOpen(false); });
});
</script>

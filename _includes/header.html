<header class="sj-header">
  <div class="sj-header__inner">
    <a class="sj-brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <button class="sj-nav__toggle" type="button" aria-expanded="false" aria-controls="sj-primary-nav">menu</button>
    <nav id="sj-primary-nav" class="sj-nav" aria-label="Primary navigation">
      <ul class="sj-nav__list">
        {% for link in site.data.navigation.main %}
          {% assign is_active = false %}
          {% if page.url == link.url %}
            {% assign is_active = true %}
          {% elsif link.url != '/' and page.url contains link.url %}
            {% assign is_active = true %}
          {% endif %}
          <li>
            <a class="sj-nav__link" href="{{ link.url | relative_url }}"{% if is_active %} aria-current="page"{% endif %}>{{ link.title }}</a>
          </li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>

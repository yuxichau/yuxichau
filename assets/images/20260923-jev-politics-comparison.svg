<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
<title id="title">Jev inferred good faith by sponsor label and bill alignment</title>
<desc id="desc">On left-coded bills Jev gave Democratic sponsors 71.9 percent good-faith probability and Republican sponsors 58.4 percent. On right-coded bills the values were 57.7 and 62.5 percent. Neutral bills produced 65.5 and 61.9 percent.</desc>
<rect width="900" height="470" fill="#235a47"/><text x="56" y="42" font-family="Arial,sans-serif" font-size="21" fill="#fffefa">Mean P(good faith) by sponsor label</text><text x="56" y="70" font-family="Arial,sans-serif" font-size="13" fill="#e7eee5">16 fixed bills · sponsor label changed, bill description held fixed</text>
<line x1="90" y1="350" x2="840" y2="350" stroke="#527766"/><line x1="90" y1="280" x2="840" y2="280" stroke="#527766"/><line x1="90" y1="210" x2="840" y2="210" stroke="#527766"/><line x1="90" y1="140" x2="840" y2="140" stroke="#527766"/><line x1="90" y1="70" x2="840" y2="70" stroke="#527766"/>
<g font-family="monospace" font-size="12" fill="#e7eee5"><text x="48" y="355">0%</text><text x="40" y="285">20%</text><text x="40" y="215">40%</text><text x="40" y="145">60%</text><text x="40" y="75">80%</text></g>
<rect x="135" y="98.35" width="85" height="251.65" fill="#fffefa"/><rect x="230" y="145.6" width="85" height="204.4" fill="#e7eee5"/><rect x="385" y="147.05" width="85" height="202.95" fill="#fffefa"/><rect x="480" y="131.25" width="85" height="218.75" fill="#e7eee5"/><rect x="635" y="120.75" width="85" height="229.25" fill="#fffefa"/><rect x="730" y="133.35" width="85" height="216.65" fill="#e7eee5"/>
<g font-family="monospace" font-size="14" fill="#fffefa" text-anchor="middle"><text x="177" y="91">71.9%</text><text x="272" y="138">58.4%</text><text x="427" y="140">57.7%</text><text x="522" y="124">62.5%</text><text x="677" y="114">65.5%</text><text x="772" y="127">61.9%</text></g>
<g font-family="Arial,sans-serif" font-size="13" fill="#fffefa" text-anchor="middle"><text x="225" y="380">Left-coded bills</text><text x="475" y="380">Right-coded bills</text><text x="725" y="380">Neutral bills</text></g><g font-family="Arial,sans-serif" font-size="12" fill="#e7eee5"><rect x="300" y="418" width="12" height="12" fill="#fffefa"/><text x="320" y="429">Democratic sponsor</text><rect x="490" y="418" width="12" height="12" fill="#e7eee5"/><text x="510" y="429">Republican sponsor</text></g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="700" height="420">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 18px; font-weight: 600; fill: #1a1a2e; }
      .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #3d3d5c; }
      .axis { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #8888aa; }
      .line-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 500; }
      .zone { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #666699; font-style: italic; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="700" height="420" fill="#fafbfc"/>
  
  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" class="title">The Cost-Capability Tradeoff</text>
  
  <!-- Axes -->
  <line x1="80" y1="360" x2="660" y2="360" stroke="#cccce0" stroke-width="2"/>
  <line x1="80" y1="360" x2="80" y2="60" stroke="#cccce0" stroke-width="2"/>
  
  <!-- Axis labels -->
  <text x="370" y="395" text-anchor="middle" class="label">Cost per Million Tokens (log scale)</text>
  <text x="30" y="220" text-anchor="middle" class="label" transform="rotate(-90, 30, 220)">Capability / Benchmark Performance</text>
  
  <!-- X-axis ticks -->
  <text x="80" y="378" text-anchor="middle" class="axis">$0</text>
  <text x="200" y="378" text-anchor="middle" class="axis">$1</text>
  <text x="350" y="378" text-anchor="middle" class="axis">$10</text>
  <text x="500" y="378" text-anchor="middle" class="axis">$30</text>
  <text x="660" y="378" text-anchor="middle" class="axis">$50</text>
  
  <!-- Y-axis ticks -->
  <text x="70" y="365" text-anchor="end" class="axis">0%</text>
  <text x="70" y="290" text-anchor="end" class="axis">50%</text>
  <text x="70" y="215" text-anchor="end" class="axis">70%</text>
  <text x="70" y="140" text-anchor="end" class="axis">85%</text>
  <text x="70" y="65" text-anchor="end" class="axis">100%</text>
  
  <!-- Capacity zone shading -->
  <rect x="80" y="60" width="265" height="300" fill="#e8f5e9" opacity="0.4"/>
  <rect x="345" y="60" width="315" height="300" fill="#fff3e0" opacity="0.4"/>
  
  <!-- Zone labels -->
  <text x="210" y="80" text-anchor="middle" class="zone">Good Enough Zone</text>
  <text x="500" y="80" text-anchor="middle" class="zone">Frontier Premium</text>
  
  <!-- Value capture arrow -->
  <polygon points="140,95 170,95 165,90 180,100 165,110 170,105 140,105" fill="#4caf50" opacity="0.7"/>
  <text x="135" y="101" text-anchor="end" class="axis" fill="#4caf50" font-weight="600">Value shifts here</text>
  
  <!-- Data points -->
  <!-- Ox Alpha -->
  <circle cx="85" cy="120" r="10" fill="#e53935" stroke="#fff" stroke-width="2"/>
  <text x="85" y="117" text-anchor="middle" class="line-label" fill="#fff" font-size="10" font-weight="700">Ox</text>
  <text x="85" y="150" text-anchor="middle" class="line-label" fill="#e53935">Ox Alpha</text>
  <text x="85" y="165" text-anchor="middle" class="axis" fill="#e53935">$0 (preview)</text>
  
  <!-- DeepSeek V4 Pro -->
  <circle cx="195" cy="100" r="8" fill="#fb8c00" stroke="#fff" stroke-width="2"/>
  <text x="195" y="80" text-anchor="middle" class="line-label" fill="#fb8c00">DeepSeek V4 Pro</text>
  <text x="195" y="95" text-anchor="middle" class="axis" fill="#fb8c00">~$2/M output</text>
  
  <!-- GPT-5.6 Sol -->
  <circle cx="500" cy="130" r="8" fill="#1e88e5" stroke="#fff" stroke-width="2"/>
  <text x="500" y="155" text-anchor="middle" class="line-label" fill="#1e88e5">GPT-5.6 Sol</text>
  <text x="500" y="170" text-anchor="middle" class="axis" fill="#1e88e5">$30/M output</text>
  
  <!-- Claude Fable 5 -->
  <circle cx="660" cy="110" r="8" fill="#8e24aa" stroke="#fff" stroke-width="2"/>
  <text x="660" y="90" text-anchor="middle" class="line-label" fill="#8e24aa">Claude Fable 5</text>
  <text x="660" y="105" text-anchor="middle" class="axis" fill="#8e24aa">$50/M output</text>
  
  <!-- Diminishing returns band -->
  <rect x="345" y="60" width="20" height="300" fill="url(#diagonalHatch)" opacity="0.3"/>
  <defs>
    <pattern id="diagonalHatch" patternUnits="userSpaceOnUse" width="8" height="8">
      <path d="M0,8 L8,0" stroke="#ff9800" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>
  
  <!-- Annotation -->
  <text x="360" y="345" text-anchor="start" class="axis" font-size="10" fill="#ff9800">Diminishing returns</text>
  <text x="360" y="357" text-anchor="start" class="axis" font-size="10" fill="#ff9800">for 2×-25× cost</text>
  
  <!-- Legend -->
  <text x="560" y="240" text-anchor="start" class="axis" font-size="10" fill="#666">DeepSWE coding benchmark</text>
  <text x="560" y="253" text-anchor="start" class="axis" font-size="10" fill="#666">(community subset, Aug 2026)</text>
  
</svg>
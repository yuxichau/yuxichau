<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
<title id="title">Jev probabilities for a fair die and fair coin</title>
<desc id="desc">Jev assigned 90.01 percent to face 1 of a fair die, against a 16.67 percent reference, and 93.23 percent to heads on a fair coin, against a 50 percent reference.</desc>
<rect width="900" height="430" fill="#fffefa"/>
<text x="56" y="35" font-family="Arial,sans-serif" font-size="21" fill="#202d2b">Jev's reported probability for the favoured outcome</text>
<text x="56" y="61" font-family="Arial,sans-serif" font-size="13" fill="#5c6864">Recorded calls · fair references shown as dashed lines</text>
<line x1="90" y1="370" x2="840" y2="370" stroke="#d5dbd3"/>
<line x1="90" y1="300" x2="840" y2="300" stroke="#e5e7df"/><line x1="90" y1="230" x2="840" y2="230" stroke="#e5e7df"/><line x1="90" y1="160" x2="840" y2="160" stroke="#e5e7df"/><line x1="90" y1="90" x2="840" y2="90" stroke="#e5e7df"/>
<text x="52" y="375" font-family="monospace" font-size="12" fill="#5c6864">0%</text><text x="44" y="305" font-family="monospace" font-size="12" fill="#5c6864">20%</text><text x="44" y="235" font-family="monospace" font-size="12" fill="#5c6864">40%</text><text x="44" y="165" font-family="monospace" font-size="12" fill="#5c6864">60%</text><text x="44" y="95" font-family="monospace" font-size="12" fill="#5c6864">80%</text>
<rect x="205" y="114.97" width="170" height="255.03" fill="#235a47"/><rect x="525" y="106.69" width="170" height="263.31" fill="#235a47"/>
<line x1="170" y1="311.66" x2="410" y2="311.66" stroke="#8d4c2d" stroke-width="2" stroke-dasharray="7 6"/><line x1="490" y1="195" x2="730" y2="195" stroke="#8d4c2d" stroke-width="2" stroke-dasharray="7 6"/>
<text x="290" y="104" text-anchor="middle" font-family="monospace" font-size="15" fill="#202d2b">90.01%</text><text x="610" y="96" text-anchor="middle" font-family="monospace" font-size="15" fill="#202d2b">93.23%</text>
<text x="290" y="398" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#202d2b">Face 1 of a die</text><text x="610" y="398" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#202d2b">Heads of a coin</text>
<text x="290" y="418" text-anchor="middle" font-family="monospace" font-size="12" fill="#8d4c2d">fair: 16.67%</text><text x="610" y="418" text-anchor="middle" font-family="monospace" font-size="12" fill="#8d4c2d">fair: 50.00%</text>
</svg>
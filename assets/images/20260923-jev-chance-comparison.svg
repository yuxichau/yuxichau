<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
<title id="title">Jev probabilities for a fair die and fair coin</title>
<desc id="desc">Jev assigned 90.01 percent to face 1 of a fair die, against a 16.67 percent reference, and 93.23 percent to heads on a fair coin, against a 50 percent reference.</desc>
<rect width="900" height="430" fill="#fffefa"/>
<text x="56" y="42" font-family="Arial,sans-serif" font-size="21" fill="#202d2b">Jev's reported probability for the favoured outcome</text>
<text x="56" y="70" font-family="Arial,sans-serif" font-size="13" fill="#5c6864">Recorded calls · fair references shown as dashed lines</text>
<line x1="90" y1="350" x2="840" y2="350" stroke="#d5dbd3"/>
<line x1="90" y1="280" x2="840" y2="280" stroke="#e5e7df"/><line x1="90" y1="210" x2="840" y2="210" stroke="#e5e7df"/><line x1="90" y1="140" x2="840" y2="140" stroke="#e5e7df"/><line x1="90" y1="70" x2="840" y2="70" stroke="#e5e7df"/>
<text x="52" y="355" font-family="monospace" font-size="12" fill="#5c6864">0%</text><text x="44" y="285" font-family="monospace" font-size="12" fill="#5c6864">20%</text><text x="44" y="215" font-family="monospace" font-size="12" fill="#5c6864">40%</text><text x="44" y="145" font-family="monospace" font-size="12" fill="#5c6864">60%</text><text x="44" y="75" font-family="monospace" font-size="12" fill="#5c6864">80%</text>
<rect x="205" y="34.97" width="170" height="315.03" fill="#235a47"/><rect x="525" y="23.69" width="170" height="326.31" fill="#235a47"/>
<line x1="170" y1="291.66" x2="410" y2="291.66" stroke="#8d4c2d" stroke-width="2" stroke-dasharray="7 6"/><line x1="490" y1="175" x2="730" y2="175" stroke="#8d4c2d" stroke-width="2" stroke-dasharray="7 6"/>
<text x="290" y="27" text-anchor="middle" font-family="monospace" font-size="15" fill="#202d2b">90.01%</text><text x="610" y="17" text-anchor="middle" font-family="monospace" font-size="15" fill="#202d2b">93.23%</text>
<text x="290" y="384" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#202d2b">Face 1 of a die</text><text x="610" y="384" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#202d2b">Heads of a coin</text>
<text x="290" y="404" text-anchor="middle" font-family="monospace" font-size="12" fill="#8d4c2d">fair: 16.67%</text><text x="610" y="404" text-anchor="middle" font-family="monospace" font-size="12" fill="#8d4c2d">fair: 50.00%</text>
</svg>
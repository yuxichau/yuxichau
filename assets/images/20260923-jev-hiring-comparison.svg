<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
<title id="title">Jev hiring probabilities by name condition</title>
<desc id="desc">Jev's mean probability of hiring was between 93.19 and 94.67 percent for named conditions, but 73.79 percent when the name was omitted.</desc>
<rect width="900" height="430" fill="#fffefa"/><text x="56" y="35" font-family="Arial,sans-serif" font-size="21" fill="#202d2b">Mean P(hire) across matched resumes</text><text x="56" y="61" font-family="Arial,sans-serif" font-size="13" fill="#5c6864">3,300 requests · strong software-engineer resumes</text>
<line x1="90" y1="370" x2="840" y2="370" stroke="#d5dbd3"/><line x1="90" y1="300" x2="840" y2="300" stroke="#e5e7df"/><line x1="90" y1="230" x2="840" y2="230" stroke="#e5e7df"/><line x1="90" y1="160" x2="840" y2="160" stroke="#e5e7df"/><line x1="90" y1="90" x2="840" y2="90" stroke="#e5e7df"/>
<text x="45" y="375" font-family="monospace" font-size="12" fill="#5c6864">0%</text><text x="37" y="305" font-family="monospace" font-size="12" fill="#5c6864">20%</text><text x="37" y="235" font-family="monospace" font-size="12" fill="#5c6864">40%</text><text x="37" y="165" font-family="monospace" font-size="12" fill="#5c6864">60%</text><text x="37" y="95" font-family="monospace" font-size="12" fill="#5c6864">80%</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
<title id="title">Jev hiring probabilities by name condition</title>
<desc id="desc">Jev's mean probability of hiring was between 93.19 and 94.67 percent for named conditions, but 73.79 percent when the name was omitted.</desc>
<rect width="900" height="430" fill="#fffefa"/><text x="56" y="42" font-family="Arial,sans-serif" font-size="21" fill="#202d2b">Mean P(hire) across matched resumes</text><text x="56" y="70" font-family="Arial,sans-serif" font-size="13" fill="#5c6864">3,300 requests · strong software-engineer resumes</text>
<line x1="90" y1="350" x2="840" y2="350" stroke="#d5dbd3"/><line x1="90" y1="280" x2="840" y2="280" stroke="#e5e7df"/><line x1="90" y1="210" x2="840" y2="210" stroke="#e5e7df"/><line x1="90" y1="140" x2="840" y2="140" stroke="#e5e7df"/><line x1="90" y1="70" x2="840" y2="70" stroke="#e5e7df"/>
<text x="45" y="355" font-family="monospace" font-size="12" fill="#5c6864">0%</text><text x="37" y="285" font-family="monospace" font-size="12" fill="#5c6864">20%</text><text x="37" y="215" font-family="monospace" font-size="12" fill="#5c6864">40%</text><text x="37" y="145" font-family="monospace" font-size="12" fill="#5c6864">60%</text><text x="37" y="75" font-family="monospace" font-size="12" fill="#5c6864">80%</text>
<rect x="125" y="18.66" width="105" height="331.34" fill="#235a47"/><rect x="275" y="18.97" width="105" height="331.03" fill="#e7eee5" stroke="#235a47"/><rect x="425" y="20.21" width="105" height="329.79" fill="#e7eee5" stroke="#235a47"/><rect x="575" y="23.84" width="105" height="326.16" fill="#e7eee5" stroke="#235a47"/><rect x="725" y="92.74" width="105" height="257.26" fill="#8d4c2d"/>
<g font-family="monospace" font-size="14" fill="#202d2b" text-anchor="middle"><text x="177" y="14">94.67%</text><text x="327" y="14">94.58%</text><text x="477" y="16">93.94%</text><text x="627" y="20">93.19%</text><text x="777" y="87">73.79%</text></g>
<g font-family="Arial,sans-serif" font-size="13" fill="#202d2b" text-anchor="middle"><text x="177" y="378">White</text><text x="327" y="378">Black</text><text x="477" y="378">East Asian</text><text x="627" y="378">South Asian</text><text x="777" y="378">No name</text></g><text x="450" y="410" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#5c6864">Named-group differences were small; removing the name changed the result.</text>
</svg>
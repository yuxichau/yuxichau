<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
<title id="title">Jev hiring probabilities by name condition</title>
<desc id="desc">Jev's mean probability of hiring was between 93.19 and 94.67 percent for named conditions, but 73.79 percent when the name was omitted.</desc>
<rect width="900" height="500" fill="#fffefa"/><text x="56" y="35" font-family="Arial,sans-serif" font-size="21" fill="#202d2b">Mean P(hire) across matched resumes</text><text x="56" y="62" font-family="Arial,sans-serif" font-size="13" fill="#5c6864">3,300 requests · strong software-engineer resumes</text>
<line x1="90" y1="410" x2="840" y2="410" stroke="#d5dbd3"/><line x1="90" y1="340" x2="840" y2="340" stroke="#e5e7df"/><line x1="90" y1="270" x2="840" y2="270" stroke="#e5e7df"/><line x1="90" y1="200" x2="840" y2="200" stroke="#e5e7df"/><line x1="90" y1="130" x2="840" y2="130" stroke="#e5e7df"/>
<text x="45" y="415" font-family="monospace" font-size="12" fill="#5c6864">0%</text><text x="37" y="345" font-family="monospace" font-size="12" fill="#5c6864">20%</text><text x="37" y="275" font-family="monospace" font-size="12" fill="#5c6864">40%</text><text x="37" y="205" font-family="monospace" font-size="12" fill="#5c6864">60%</text><text x="37" y="135" font-family="monospace" font-size="12" fill="#5c6864">80%</text>
<rect x="125" y="145.92" width="105" height="264.08" fill="#235a47"/><rect x="275" y="146.18" width="105" height="263.82" fill="#e7eee5" stroke="#235a47"/><rect x="425" y="147.0" width="105" height="263.0" fill="#e7eee5" stroke="#235a47"/><rect x="575" y="149.07" width="105" height="260.93" fill="#e7eee5" stroke="#235a47"/><rect x="725" y="203.39" width="105" height="206.61" fill="#8d4c2d"/>
<g font-family="monospace" font-size="14" fill="#202d2b" text-anchor="middle"><text x="177" y="137">94.67%</text><text x="327" y="137">94.58%</text><text x="477" y="139">93.94%</text><text x="627" y="141">93.19%</text><text x="777" y="195">73.79%</text></g>
<g font-family="Arial,sans-serif" font-size="13" fill="#202d2b" text-anchor="middle"><text x="177" y="447">White</text><text x="327" y="447">Black</text><text x="477" y="447">East Asian</text><text x="627" y="447">South Asian</text><text x="777" y="447">No name</text></g>
<text x="450" y="475" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#5c6864">Named-group differences were small; removing the name changed the result.</text>
</svg>
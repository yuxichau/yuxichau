<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Establish a trading house in 1852 Hong Kong. Trade cargo, develop the harbour, and build a legacy in this free, offline seasonal strategy game.">
  <title>Hong Kong Tycoon — A Merchant’s Chronicle</title>
  <style>:root {
  color-scheme: light dark;
  --paper: #f1ebde;
  --surface: #faf6ed;
  --subtle: #e8e1d2;
  --ink: #292e29;
  --muted: #656a60;
  --line: #cfc7b5;
  --green: #264c3f;
  --green-soft: #e0e8dd;
  --gold: #9a6a2a;
  --red: #a53d2e;
  --red-soft: #f3e1d8;
  --white: #fff9ed;
  --shadow: #292e2918;
  --backdrop: #17291ed1;
  --serif: Georgia, 'Times New Roman', serif;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.55; }
button, input, select { font: inherit; }
button { cursor: pointer; border: 1px solid var(--line); border-radius: 3px; background: var(--surface); color: var(--ink); padding: .55rem .85rem; transition: background .15s, border-color .15s; }
button:hover:not(:disabled) { background: var(--subtle); border-color: var(--muted); }
button:disabled { cursor: not-allowed; opacity: .45; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible, a:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
input, select { min-inline-size: 0; max-inline-size: 100%; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 3px; padding: .6rem .7rem; }
input[type=number] { font-variant-numeric: tabular-nums; }
input[type=checkbox] { accent-color: var(--green); inline-size: 16px; block-size: 16px; }
h1, h2, h3, h4, p { margin-block-start: 0; }
h2, h3, h4 { font-family: var(--serif); font-weight: 500; line-height: 1.2; }
h2 { font-size: 1.85rem; margin-block-end: .5rem; }
h3 { font-size: 1.35rem; margin-block-end: .5rem; }
h4 { font-size: 1.12rem; }
p { margin-block-end: .8rem; }
small, .small { font-size: .78rem; }
.muted { color: var(--muted); }
.positive { color: var(--green); }
.negative { color: var(--red); }
.mono, .money { font-variant-numeric: tabular-nums; }
.eyebrow { font-size: .66rem; text-transform: uppercase; letter-spacing: .17em; font-weight: 700; color: var(--muted); margin-block-end: .4rem; }
.primary { background: var(--green); border-color: var(--green); color: var(--white); }
.primary:hover:not(:disabled) { background: var(--ink); color: var(--white); }
.danger { color: var(--red); border-color: var(--red); }
.text-button { padding: .2rem 0; border: 0; background: transparent; color: var(--green); text-decoration: underline; text-underline-offset: 3px; }
.skip-link { position: fixed; inset-block-start: -100px; inset-inline-start: 1rem; background: var(--surface); padding: 1rem; z-index: 10; color: var(--ink); }
.skip-link:focus { inset-block-start: 1rem; }
.masthead { max-inline-size: 1380px; margin-inline: auto; padding: 1.15rem 2.5rem 0; }
.edition { display: flex; justify-content: space-between; gap: 1rem; border-block-end: 1px solid var(--ink); padding-block-end: .6rem; font-family: var(--serif); font-size: .8rem; font-style: italic; color: var(--muted); }
.brand-row { display: flex; align-items: center; justify-content: space-between; padding-block: 1.45rem 1.1rem; }
h1 { font-family: var(--serif); font-size: clamp(2.4rem, 4.8vw, 4.5rem); font-weight: 500; letter-spacing: -.055em; line-height: 1; margin: 0; }
h1 em { color: var(--green); font-weight: 400; }
.seal { color: var(--red); border: 2px solid var(--red); padding: .3rem .65rem; transform: rotate(-5deg); font-family: var(--serif); font-size: 1.5rem; line-height: 1.15; text-align: center; }
.seal small { font-size: .7rem; letter-spacing: .12em; }
.masthead-bottom { border-block-start: 3px double var(--ink); border-block-end: 1px solid var(--line); padding-block: .55rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
#house-name { font-family: var(--serif); font-style: italic; overflow-wrap: anywhere; }
.utilities { display: flex; gap: 1rem; flex-shrink: 0; }
.utilities button { font-size: .72rem; padding: 0; border: 0; background: none; color: var(--muted); }
.utilities button:hover { text-decoration: underline; }
.game-layout { display: grid; grid-template-columns: 245px minmax(0, 1fr); gap: 2rem; max-inline-size: 1380px; margin-inline: auto; padding: 1.75rem 2.5rem 3rem; align-items: start; }
.ledger { position: sticky; inset-block-start: 1.5rem; padding-inline-end: 1.8rem; border-inline-end: 1px solid var(--line); }
.season { font-family: var(--serif); font-size: 1.7rem; margin-block-end: .25rem; }
.campaign-progress { display: flex; gap: 3px; margin-block: .8rem 1.4rem; }
.campaign-progress span { background: var(--line); block-size: 4px; flex: 1; }
.campaign-progress span.filled { background: var(--green); }
.cash-value { font-family: var(--serif); font-size: 2.15rem; line-height: 1.2; }
.ledger-section { padding-block: 1rem; border-block-end: 1px solid var(--line); }
.ledger-section:first-child { padding-block-start: 0; }
.ledger-row { display: flex; justify-content: space-between; gap: .8rem; font-size: .8rem; margin-block: .45rem; }
.ledger-row strong { font-weight: 600; white-space: nowrap; }
.reserve { background: var(--green-soft); padding: .7rem; margin-block-start: .8rem; }
.reserve.warning { background: var(--red-soft); }
.reserve p { margin: 0; font-size: .72rem; }
.meter { block-size: 5px; inline-size: 100%; border: 0; display: block; margin-block: .55rem; background: var(--line); }
.meter::-webkit-progress-bar { background: var(--line); }
.meter::-webkit-progress-value { background: var(--green); }
.meter::-moz-progress-bar { background: var(--green); }
.turn-controls { margin-block-start: 1.3rem; }
.end-season { inline-size: 100%; display: flex; align-items: center; justify-content: space-between; gap: .8rem; padding: .85rem; font-size: .85rem; }
.save-status { color: var(--muted); font-size: .66rem; text-align: center; margin-block: .7rem 0; }
.bulletin { border: 1px solid var(--line); background: var(--surface); padding: 1rem 1.2rem; margin-block-end: 1.4rem; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1.3rem; position: relative; }
.bulletin h2 { font-size: 1.1rem; font-style: italic; }
.bulletin p { font-family: var(--serif); font-size: .95rem; margin: 0; }
.weather { border-inline-start: 1px solid var(--line); padding-inline-start: 1.2rem; min-inline-size: 130px; align-self: center; }
.weather strong { font-family: var(--serif); display: block; font-size: 1.1rem; font-weight: 500; }
.weather small { color: var(--muted); }
.tabs { display: flex; gap: 1.4rem; border-block-end: 1px solid var(--line); margin-block-end: 1.4rem; overflow-x: auto; }
.tabs button { flex-shrink: 0; border: 0; background: transparent; border-radius: 0; border-block-end: 3px solid transparent; padding: .45rem 0 .75rem; color: var(--muted); font-size: .82rem; }
.tabs button[aria-current] { color: var(--green); border-block-end-color: var(--green); font-weight: 700; }
.section-heading { display: flex; justify-content: space-between; align-items: start; gap: 1rem; margin-block-end: 1.25rem; }
.section-heading p { color: var(--muted); font-size: .83rem; margin: 0; }
.badge { display: inline-block; border: 1px solid var(--line); padding: .15rem .45rem; font-size: .65rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); white-space: nowrap; }
.badge.risk { color: var(--red); border-color: var(--red); }
.check-label { display: flex; gap: .45rem; align-items: center; font-size: .75rem; white-space: nowrap; }
.commodity-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
.commodity { background: var(--surface); border: 1px solid var(--line); padding: 1.1rem; }
.commodity-header { display: flex; justify-content: space-between; align-items: start; gap: .7rem; }
.commodity h3 { font-size: 1.7rem; margin-block-end: .15rem; }
.commodity .description { color: var(--muted); font-size: .75rem; min-block-size: 2.5rem; margin-block: .5rem .8rem; }
.spark { inline-size: 100%; block-size: 37px; display: block; margin-block: .5rem .7rem; overflow: visible; color: var(--green); }
.spark polyline { fill: none; stroke: currentColor; stroke-width: 1.6; vector-effect: non-scaling-stroke; }
.spark line { stroke: var(--line); stroke-dasharray: 3 3; }
.price-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.price-row span { display: block; font-size: .66rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.price-row strong { font-family: var(--serif); font-size: 1.45rem; font-weight: 500; }
.stock-row { display: flex; justify-content: space-between; gap: .5rem; padding-block: .6rem; margin-block: .5rem; border-block: 1px solid var(--line); font-size: .73rem; }
.trade-input { display: flex; gap: .4rem; align-items: center; }
.trade-input label { color: var(--muted); font-size: .75rem; }
.trade-input input { inline-size: 5rem; padding: .4rem .5rem; flex: 1; }
.trade-input button { font-size: .72rem; padding: .45rem .6rem; }
.trade-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; margin-block-start: .6rem; }
.trade-buttons button { font-size: .77rem; }
.quote { font-size: .69rem; color: var(--muted); margin-block: .6rem 0; min-block-size: 2.2em; }
.note { font-size: .76rem; color: var(--muted); margin-block: 1rem; }
.notice { background: var(--green-soft); padding: 1.1rem 1.2rem; border: 1px solid var(--line); margin-block-end: 1.25rem; }
.notice h3 { margin-block-end: .4rem; }
.notice p { font-size: .84rem; }
.notice.warning { background: var(--red-soft); border-color: var(--red); }
.notice .actions { margin-block-start: .8rem; }
.actions { display: flex; flex-wrap: wrap; gap: .55rem; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 1rem; }
.card { padding: 1.2rem; border: 1px solid var(--line); background: var(--surface); }
.card > p { font-size: .81rem; color: var(--muted); }
.card .cost { font-family: var(--serif); font-size: 1.7rem; margin-block: .65rem; }
.card .detail { display: flex; justify-content: space-between; gap: .7rem; font-size: .76rem; margin-block: .5rem; }
.subheading { margin-block: 1.8rem 1rem; padding-block-end: .6rem; border-block-end: 1px solid var(--line); }
.upgrade-list { display: grid; gap: .5rem; margin-block-start: 1rem; }
.upgrade-list button { display: flex; justify-content: space-between; gap: .5rem; font-size: .76rem; text-align: start; }
.installed { color: var(--green); font-size: .74rem; padding-block: .2rem; }
.contract-benefit { color: var(--green); background: var(--green-soft); font-size: .76rem; padding: .55rem; margin-block: .8rem; }
.bank { display: grid; grid-template-columns: 1fr 1fr; gap: 1.3rem; }
.bank label { display: block; font-size: .78rem; margin-block-end: .4rem; }
.bank input { inline-size: 100%; margin-block-end: .7rem; }
.requirements { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; }
.requirement { background: var(--surface); border: 1px solid var(--line); padding: .8rem 1rem; }
.requirement .detail { display: flex; justify-content: space-between; gap: .6rem; font-size: .78rem; }
.requirement strong { white-space: nowrap; }
.event { margin-block-start: 1.2rem; border-inline-start: 3px solid var(--gold); }
.chronicle { list-style: none; padding: 0; margin: 0; }
.chronicle li { display: grid; grid-template-columns: 100px 1fr; gap: 1rem; border-block-end: 1px solid var(--line); padding-block: .8rem; font-size: .82rem; }
.chronicle time { font-size: .72rem; color: var(--muted); }
.chronicle p { margin: 0; }
.report-summary { display: grid; grid-template-columns: 1fr 1fr; gap: .7rem; margin-block: 1.2rem; }
.report-summary > div { padding: .8rem; background: var(--subtle); }
.report-summary strong { font-size: 1.3rem; font-family: var(--serif); font-weight: 500; display: block; }
.report-list { padding-inline-start: 1.2rem; }
.report-list li { padding-block: .25rem; font-size: .85rem; }
.footer { border-block-start: 1px solid var(--line); padding: 1rem 2.5rem; display: flex; justify-content: space-between; gap: 1rem; max-inline-size: 1380px; margin-inline: auto; font-size: .7rem; color: var(--muted); }
.footer span:first-child { font-family: var(--serif); font-style: italic; }
.toast { position: fixed; inset-block-end: 1.2rem; inset-inline-start: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: .8rem 1.2rem; border-radius: 4px; box-shadow: 0 4px 20px var(--shadow); max-inline-size: min(90vw, 550px); inline-size: max-content; z-index: 20; opacity: 0; pointer-events: none; transition: opacity .2s; font-size: .83rem; }
.toast.visible { opacity: 1; }
dialog { background: var(--surface); color: var(--ink); border: 1px solid var(--line); padding: 0; inline-size: min(640px, calc(100vw - 2rem)); max-block-size: calc(100dvh - 3rem); border-radius: 4px; box-shadow: 0 20px 80px var(--shadow); }
dialog::backdrop { background: var(--backdrop); }
#modal-body { padding: 2rem; }
.modal-header { display: flex; justify-content: space-between; align-items: start; gap: 1rem; margin-block-end: 1rem; }
.modal-header button { border: 0; font-size: 1.25rem; line-height: 1; padding: .2rem .5rem; }
.modal-header h2 { margin: 0; }
.modal-actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: .5rem; margin-block-start: 1.5rem; }
.intro-art { inline-size: 100%; block-size: 105px; margin-block: .6rem 1.1rem; color: var(--green); }
.intro-art .line-art { fill: none; stroke: currentColor; stroke-width: 1.3; }
.intro-art .solid-art { fill: currentColor; opacity: .13; }
.new-form { display: grid; gap: .85rem; }
.new-form label { display: grid; gap: .3rem; font-size: .8rem; }
.guide-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.guide-grid h3 { font-size: 1.1rem; }
.guide-grid p { font-size: .83rem; color: var(--muted); }
details { border-block-end: 1px solid var(--line); padding-block: .8rem; }
summary { cursor: pointer; font-family: var(--serif); font-size: 1.1rem; }
details p, details li { font-size: .82rem; margin-block-start: .7rem; }
.ending { padding: 1.5rem; border: 3px double var(--green); text-align: center; background: var(--surface); margin-block-end: 1.5rem; }
.ending h2 { font-size: 2.2rem; }
.ending .actions { justify-content: center; }
@media (prefers-color-scheme: dark) {
  :root { --paper: #202721; --surface: #283029; --subtle: #343d32; --ink: #efe8d9; --muted: #b3b7a6; --line: #4d5749; --green: #a4c6a9; --green-soft: #334334; --gold: #d7b67a; --red: #ef9b83; --red-soft: #49342d; --white: #202721; --shadow: #00000030; --backdrop: #101911dc; }
}
@media (max-width: 1050px) {
  .masthead { padding-inline: 1.5rem; }
  .game-layout { padding-inline: 1.5rem; grid-template-columns: 215px minmax(0, 1fr); gap: 1.3rem; }
  .ledger { padding-inline-end: 1.2rem; }
  .tabs { gap: 1rem; }
  .section-heading { flex-wrap: wrap; }
}
@media (max-width: 760px) {
  .masthead { padding: .8rem 1rem 0; }
  .brand-row { padding-block: 1.1rem; }
  .edition { font-size: .67rem; }
  .brand-row .eyebrow { font-size: .55rem; }
  .seal { font-size: 1.2rem; }
  .masthead-bottom { flex-wrap: wrap; gap: .55rem; }
  .utilities { gap: .95rem; }
  .game-layout { display: block; padding: 1rem; }
  .ledger { position: static; border-inline-end: 0; padding-inline-end: 0; margin-block-end: 1.2rem; }
  #ledger { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1rem; }
  .ledger-section { padding-block: .6rem; }
  .ledger-section:first-child { padding-block-start: .6rem; }
  .season { font-size: 1.4rem; }
  .cash-value { font-size: 1.7rem; }
  .campaign-progress { margin-block: .6rem; }
  .turn-controls { display: flex; align-items: center; gap: 1rem; margin-block-start: .8rem; }
  .end-season { inline-size: auto; flex: 1; }
  .save-status { flex: 1; margin: 0; text-align: start; }
  .bulletin { padding: .85rem; gap: .8rem; }
  .weather { min-inline-size: 100px; padding-inline-start: .8rem; }
  .weather strong { font-size: .95rem; }
  .bulletin p { font-size: .85rem; }
  .footer { padding: 1rem; flex-wrap: wrap; }
}
@media (max-width: 480px) {
  .commodity-grid, .requirements, .bank, .guide-grid { grid-template-columns: 1fr; }
  .commodity .description { min-block-size: 0; }
  .bulletin { grid-template-columns: 1fr; }
  .weather { border-inline-start: 0; padding-inline-start: 0; border-block-start: 1px solid var(--line); padding-block-start: .5rem; display: flex; align-items: center; gap: .7rem; }
  .weather .eyebrow { margin: 0; }
  .tabs { gap: 1.05rem; }
  .tabs button { font-size: .76rem; }
  #modal-body { padding: 1.25rem; }
  .chronicle li { grid-template-columns: 76px 1fr; gap: .65rem; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to the trading desk</a>
  <header class="masthead">
    <div class="edition"><span>Victoria Harbour · Est. 1852</span><span>A merchant’s chronicle</span></div>
    <div class="brand-row"><div><p class="eyebrow">Commerce · Enterprise · Influence</p><h1>Hong Kong <em>Tycoon</em></h1></div><div class="seal" aria-hidden="true">香港<br><small>1852</small></div></div>
    <div class="masthead-bottom"><span id="house-name">Victoria Trading Company</span><div class="utilities"><button type="button" data-ui="guide">How to play</button><button type="button" data-ui="export">Export save</button><button type="button" data-ui="import">Import</button><button type="button" data-ui="new">New house</button></div></div>
  </header>
  <div class="game-layout">
    <aside class="ledger" aria-label="House ledger">
      <div id="ledger"></div>
      <div class="turn-controls"><button class="primary end-season" type="button" data-ui="end">Close the season <span aria-hidden="true">→</span></button><p id="save-status" class="save-status">Progress is saved on this device.</p></div>
    </aside>
    <main id="main" tabindex="-1">
      <div id="alerts"></div>
      <section id="bulletin" class="bulletin" aria-label="Harbour bulletin"></section>
      <nav class="tabs" aria-label="Trading house departments">
        <button type="button" data-tab="exchange" aria-current="page">Exchange</button>
        <button type="button" data-tab="estate">Estate</button>
        <button type="button" data-tab="works">Public works</button>
        <button type="button" data-tab="standing">Standing</button>
        <button type="button" data-tab="ledger">Chronicle</button>
      </nav>
      <div id="panel"></div>
    </main>
  </div>
  <footer class="footer"><span>A fortune is earned. A legacy is built.</span><span>Alternate-history strategy · 72 seasons · Entirely offline</span></footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="modal" aria-labelledby="modal-title"><div id="modal-body"></div></dialog>
  <input id="import-file" type="file" accept=".json,application/json" hidden>
  <noscript><p class="notice">Hong Kong Tycoon needs JavaScript enabled to run its local game simulation.</p></noscript>

  }
  function standingPanel() {
    return `<div class="section-heading"><div><p class="eyebrow">Commerce & public life</p><h2>The road to Government House</h2><p>Wealth opens doors. A sustained record earns the appointment.</p></div></div><div class="notice"><h3>An alternate-history ambition</h3><p>Become Governor by satisfying every requirement for four consecutive seasons. Appointments are reviewed at the end of each year. Reliable everyday business builds only a modest baseline; public works and civic service carry you further.</p></div><div class="requirements">${E.appointment(state).map(r => `<div class="requirement"><div class="detail"><span>${r.met ? '✓ ' : ''}${r.label}</span><strong>${r.money ? money(r.current) : Math.round(r.current * 10) / 10} / ${r.money ? money(r.target) : r.target}</strong></div>${progress(r.current, r.target, r.label)}</div>`).join('')}</div><h3 class="subheading">Two kinds of confidence</h3><div class="cards"><div class="card"><h3>Official Standing</h3><p>Complete contracts, meet financial obligations, and assist public supply. Everyday reliability rises only to 25. Failed contracts and opium route incidents damage your record.</p></div><div class="card"><h3>Public Trust</h3><p>Deliver useful works, supply food relief, and support workers. Routine fair dealing rises only to 20. Opium commerce damages trust; holding it also postpones your eight-season transition out of the trade.</p></div></div>${eventMarkup()}<p class="note">Hong Kong Tycoon is alternate history. The appointment path is a game rule. Opium’s colonial legality varied by route and period; official approval did not remove its community harms. Dollar values and public-project terms are balance abstractions.</p>`;
  }
  function chronicle() {
    return `<div class="section-heading"><div><p class="eyebrow">The merchant’s chronicle</p><h2>A record of the house</h2><p>The latest 160 entries, preserved in your save file.</p></div>${state.report ? '<button type="button" data-ui="report">Last seasonal report</button>' : ''}</div><div class="report-summary"><div><span class="eyebrow">Highest net worth</span><strong>${money(state.stats.bestWorth)}</strong></div><div><span class="eyebrow">Unrecovered cargo losses</span><strong>${money(state.stats.losses)}</strong></div></div><ol class="chronicle">${state.log.map(l => `<li><time>${E.date({ turn: l.turn })}</time><p class="${l.tone === 'bad' ? 'negative' : l.tone === 'good' ? 'positive' : ''}">${esc(l.text)}</p></li>`).join('')}</ol>`;
  }
  function updateQuotes() {
    if (tab !== 'exchange') return;
    for (const k of Object.keys(E.GOODS)) {
      const node = $(`#quote-${k}`);
      if (!node) continue;
      const qty = quantities[k];
      const valid = Number.isSafeInteger(qty) && qty > 0 && qty <= 1000000;
      node.textContent = valid ? `Order ${money(E.buyQuote(state, k, qty))} · Sale ${money(E.sellQuote(state, k, qty))}${qty > state.stock[k] ? ' (not enough held)' : ''}` : 'Enter a positive whole number of units.';
      const buy = $(`[data-trade="buy"][data-good="${k}"]`);
      const sell = $(`[data-trade="sell"][data-good="${k}"]`);
      buy.disabled = Boolean(!valid || state.ending || state.distress || E.buyQuote(state, k, qty) > state.cash || E.usedSpace(state) + qty * E.GOODS[k].space > E.capacity(state, true));
      sell.disabled = Boolean(!valid || state.ending || qty > state.stock[k]);
    }
  }
  function render() {
    renderLedger(); renderAlerts(); renderBulletin();
    for (const button of document.querySelectorAll('.tabs [data-tab]')) {
      if (button.dataset.tab === tab) button.setAttribute('aria-current', 'page');
      else button.removeAttribute('aria-current');
    }
    $('#panel').innerHTML = ({ exchange, estate, works, standing: standingPanel, ledger: chronicle })[tab]();
    updateQuotes();
  }
  function showReport() {
    if (!state.report) return;
    const r = state.report;
    modal(`${r.season} · Closing report`, `${state.ending ? `<p class="eyebrow">${state.ending === 'governor' ? 'Your appointment is confirmed' : 'The campaign has concluded'}</p>` : ''}<div class="report-summary"><div><span class="eyebrow">Operating expenses</span><strong>${money(r.expense)}</strong></div><div><span class="eyebrow">Cash movement at close</span><strong class="${r.cashChange >= 0 ? 'positive' : 'negative'}">${signed(r.cashChange)}</strong></div></div><ul class="report-list">${r.entries.map(t => `<li>${esc(t)}</li>`).join('')}</ul><p class="note">Cash movement covers seasonal resolution, excluding orders and sales you made earlier. It is not a profit figure.</p>${state.distress ? `<p class="negative">${money(-state.cash)} remains overdue. Raise cash before continuing.</p>` : ''}`, '<button type="button" class="primary" data-ui="close">Return to the house</button>');
  }
  function bank() {
    const room = Math.max(0, E.creditLimit(state) - state.debt);
    modal('The merchant’s bank', `<p class="muted">Secured credit is backed by 45% of property book value and 25% of stored cargo value. Official Standing of 25 unlocks an extra $10,000.</p><div class="report-summary"><div><span class="eyebrow">Available credit</span><strong>${money(room)}</strong></div><div><span class="eyebrow">Outstanding debt</span><strong>${money(state.debt)}</strong></div></div><p class="note">Interest: 2.5% each season, included in operating expenses. The credit limit governs new borrowing; falling collateral does not trigger an automatic margin call.</p><div class="bank"><div><label for="borrow-amount">New loan amount</label><input id="borrow-amount" type="number" min="1" step="1" value="${Math.max(1, Math.min(10000, room))}"><button type="button" data-ui="borrow"${disabled(state.ending || room < 1)}>Borrow</button></div><div><label for="repay-amount">Principal to repay</label><input id="repay-amount" type="number" min="1" step="1" value="${Math.max(1, Math.min(10000, state.debt, state.cash))}"><button type="button" data-ui="repay"${disabled(state.ending || state.distress || state.debt < 1)}>Repay</button></div></div>`);
  }
  function newHouse(first = false) {
    modal(first ? 'Your ship has arrived.' : 'Establish a new trading house', `<svg class="intro-art" viewBox="0 0 520 105" role="img" aria-label="A sailing vessel enters Victoria Harbour"><path class="solid-art" d="M0 80 55 55 98 70 155 28 203 61 255 41 318 77 386 54 435 70 490 45 520 69V100H0Z"></path><path class="line-art" d="M0 90H520M0 96H160M280 99H520M80 85 60 72H218L202 85ZM145 12V72M145 15 96 63H145ZM152 26 187 63H152ZM99 22V69M96 27 76 62H96ZM245 80V60H264V80M275 80V53H304V80M322 80V64H351V80M365 80V46H392V80M416 80V59H454V80"></path></svg><p>Spring 1852. You land in Hong Kong with <strong>$100,000</strong>, a name to make, and eighteen years to leave your mark.</p><p class="muted small">Trade rice, tea, cement, and opium. Build your stores and the city around them. Become Governor, endure to 1870, or lose the house to your creditors.</p><form id="new-form" class="new-form"><label>Name of your trading house<input id="new-name" name="house" maxlength="60" value="Victoria Trading Company" required autocomplete="off"></label><label>Campaign seed <span class="muted">Same seed + same decisions = same history</span><input id="new-seed" name="seed" maxlength="64" value="${first ? 'Victoria-1852' : `Harbour-${Math.floor(Math.random() * 100000)}`}" required autocomplete="off"></label>${!first || saveBlocked ? '<p class="small negative">Starting a new house replaces the autosave on this device. Export the current campaign first if you wish to keep it.</p>' : ''}<button type="submit" class="primary">Sign the founding papers</button></form><p class="note">No account, installation, or connection required. Autosaves stay in this browser; export a save to move between devices.</p>`);
  }
  function guide() {
    modal('The merchant’s handbook', `<div class="guide-grid"><div><h3>1. Establish your house</h3><p>Start with a $35,000 lease-and-warehouse package, or choose a location on the Estate page. Your warehouse opens next season.</p></div><div><h3>2. Keep cash in reserve</h3><p>Try 50 tea and 30 rice for your first shipment. Keep $20,000–$25,000 for expenses and surprises. “Budget max” reserves current commitments only.</p></div><div><h3>3. Trade across seasons</h3><p>New orders cannot be sold immediately. Close the season to receive cargo, then sell or hold it. Supplier prices change each season; sell margins differ by commodity.</p></div><div><h3>4. Build a legacy</h3><p>Use trade profits to fund public works. Meet all Standing-page requirements for four seasons and pass the annual review to become Governor.</p></div></div><details><summary>Weather, storage & opium</summary><p>Storm risk is 10% in Spring, 30% in Summer, 18% in Autumn, and 4% in Winter. Weather can damage stored and incoming cargo. Rice and tea deteriorate in store; cement is vulnerable to damp. Improvements protect stored goods.</p><p>Opium route incidents affect 65% of the shipment, plus any weather losses. Base incident risk is 16% before 1858 and 9% afterward, reduced by watchmen. Opium purchases and sales lower Public Trust, and holding it postpones appointment eligibility.</p></details><details><summary>Contracts & working capital</summary><p>Post a bond, then fund labour and cement before receiving milestone payments. Missing cement is bought automatically at a premium; keep stock to avoid that premium. Smaller contracts take three stages and major contracts take four. One manager can supervise one active project, or two with a superintendent.</p><p>Work pauses if you cannot fund it. Two buffer seasons allow for delays. Default forfeits the bond, adds a 5% penalty, and removes 15 Official Standing and 8 Public Trust.</p></details><details><summary>Debt & bankruptcy</summary><p>Debt charges 2.5% seasonal interest. A negative cash balance means an obligation is overdue. You can sell goods, borrow within your limit, or liquidate property at 65% of book value. Choose bankruptcy only when you cannot rescue the house.</p></details><details><summary>Endings & save files</summary><p>The campaign runs from Spring 1852 through Winter 1869. All final obligations resolve before survival is awarded as 1870 begins. Governor appointment requires eight years, $350,000 net worth, 75 Official Standing, 60 Public Trust, four completed contracts including two major projects, eight seasons out of opium, and four consecutive qualifying seasons.</p><p>Every decision is autosaved when browser storage is available. Export and import JSON saves to back up or transfer a campaign. Local saves are editable; this is a single-player game without a competitive leaderboard.</p></details><p class="note">This is an alternate-history game, not an economic reconstruction. Prices use abstract silver dollars. Colonial office and public welfare are represented as separate measures of reputation.</p>`, '<button type="button" class="primary" data-ui="close">Back to business</button>');
  }
  function exportSave() {
    try {
      const blob = new Blob([E.serialize(state)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `hong-kong-tycoon-${state.turn}-${state.seed.replace(/[^a-z0-9-]/gi, '-').slice(0, 30)}.json`;
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      toast('Save exported. Keep this file to restore your house.');
    } catch (error) { toast(error.message); }
  }
  document.addEventListener('click', event => {
    const button = event.target.closest('button');
    if (!button || button.disabled) return;
    const d = button.dataset;
    if (d.tab) {
      tab = d.tab; render();
      $(`.tabs [data-tab="${tab}"]`).focus();
    } else if (d.trade) {
      const qty = quantities[d.good];
      if (d.good === 'opium' && d.trade === 'buy') confirm('An opium consignment', `<p>Order ${qty} units for <strong>${money(E.buyQuote(state, 'opium', qty))}</strong>?</p><p class="muted">This trade lowers Public Trust, exposes the cargo to uninsured route losses, and restarts the eight-season transition required for appointment.</p>`, () => dispatch({ type: 'buy', good: d.good, qty }, 'Order entered in the ledger.'), 'Place order');
      else dispatch({ type: d.trade, good: d.good, qty }, d.trade === 'buy' ? 'Order entered. Cargo arrives next season.' : 'Sale completed. Cash is in the ledger.');
    } else if (d.action) {
      const action = { type: d.action };
      if (d.id) action.id = Number(d.id);
      if (d.location) action.location = d.location;
      if (d.upgrade) action.upgrade = d.upgrade;
      if (d.choice) action.choice = d.choice;
      dispatch(action, 'The house ledger has been updated.');
    } else if (d.ui) {
      switch (d.ui) {
        case 'close': closeModal(); break;
        case 'confirm': { const run = confirmAction; closeModal(); if (run) run(); break; }
        case 'guide': guide(); break;
        case 'new': newHouse(); break;
        case 'export': exportSave(); break;
        case 'import': $('#import-file').click(); break;
        case 'bank': bank(); break;
        case 'report': showReport(); break;
        case 'borrow': case 'repay': {
          const amount = Number($(`#${d.ui}-amount`).value);
          if (dispatch({ type: d.ui, amount }, 'Bank transaction completed.')) bank();
          break;
        }
        case 'max-buy': {
          const budget = Math.max(0, state.cash - E.commitments(state));
          const free = Math.floor((E.capacity(state, true) - E.usedSpace(state)) / E.GOODS[d.good].space);
          let qty = Math.max(0, Math.min(free, Math.floor(budget / E.buyQuote(state, d.good, 1))));
          while (qty > 0 && E.buyQuote(state, d.good, qty) > budget) qty--;
          quantities[d.good] = qty; $(`#qty-${d.good}`).value = qty; updateQuotes(); break;
        }
        case 'all': quantities[d.good] = state.stock[d.good]; $(`#qty-${d.good}`).value = quantities[d.good]; updateQuotes(); break;
        case 'contract': {
          const c = state.tenders.find(c => c.id === d.id);
          confirm('Accept the government tender?', `<p><strong>${E.PROJECTS[c.type].name}</strong> requires a ${money(c.bond)} bond now and approximately ${money(E.contractCost(state, c).cash)} in cash for its next stage.</p><p class="muted">The house pays costs before receiving each milestone payment. Keep a buffer for rising cement prices and weather delays.</p>`, () => dispatch({ type: 'contract', id: d.id }, 'Contract awarded. Work begins at season close.'), 'Post performance bond'); break;
        }
        case 'abandon': confirm('Abandon this public work?', '<p>Your bond will be forfeited, a 5% contract penalty becomes payable, and Official Standing and Public Trust will fall.</p>', () => dispatch({ type: 'abandon', id: d.id }), 'Abandon contract'); break;
        case 'liquidate': confirm('Liquidate this property?', '<p>The property and its improvements will be sold at 65% of book value. Remaining warehouses must have room for all stored and incoming cargo.</p>', () => dispatch({ type: 'liquidate', id: Number(d.id) }), 'Sell property'); break;
        case 'bankrupt': confirm('Close the house for good?', '<p>This ends your campaign in bankruptcy. You can still return to the ledger to sell assets or arrange credit.</p>', () => dispatch({ type: 'bankrupt' }), 'Declare bankruptcy'); break;
        case 'end': {
          const reserve = state.cash - E.commitments(state);
          const next = E.date({ turn: state.turn + 1 });
          confirm(`Close ${E.date(state)}?`, `<p>Pay <strong>${money(E.operating(state))}</strong> in house expenses, resolve cargo arrivals and public works, and advance to <strong>${next}</strong>.</p><div class="reserve ${reserve < 0 ? 'warning' : ''}"><p>Cash after estimated commitments, before cargo claims and project payments</p><strong>${money(reserve)}</strong></div>${reserve < 0 ? '<p class="negative small">You may face an overdue balance or paused contract. Consider selling stock or borrowing first.</p>' : ''}${state.event && !state.event.resolved ? '<p class="note">An unanswered seasonal appeal will expire.</p>' : ''}`, () => dispatch({ type: 'end' }), 'Close the season'); break;
        }
      }
    }
  });
  document.addEventListener('input', event => {
    if (event.target.dataset.qty) { quantities[event.target.dataset.qty] = Number(event.target.value); updateQuotes(); }
  });
  document.addEventListener('change', event => {
    if (event.target.id === 'insurance') dispatch({ type: 'insurance', enabled: event.target.checked });
  });
  document.addEventListener('submit', event => {
    if (event.target.id !== 'new-form') return;
    event.preventDefault();
    state = E.newGame($('#new-seed').value, $('#new-name').value);
    saveBlocked = false;
    tab = 'exchange'; save(); closeModal(); render();
    toast('Your founding papers are signed. Welcome to Victoria Harbour.');
  });
  $('#import-file').addEventListener('change', async event => {
    const file = event.target.files[0];
    event.target.value = '';
    if (!file) return;
    try {
      if (file.size > 1000000) throw new Error('Save file is too large.');
      const imported = E.deserialize(await file.text());
      confirm('Restore this trading house?', `<p>Load <strong>${esc(imported.name)}</strong> in ${E.date(imported)} with ${money(imported.cash)} cash?</p><p class="muted">This replaces the current autosave. Export your current house first if you want to keep both.</p>`, () => {
        state = imported; saveBlocked = false; tab = 'exchange'; save(); render(); toast('Trading house restored.');
      }, 'Restore save');
    } catch (error) { toast(error.message); }
  });
  $('#modal').addEventListener('cancel', () => { confirmAction = null; });
  render();
  if (!recovered) newHouse(true);
})();
</script>
</body>
</html>

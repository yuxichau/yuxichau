name: Build Jekyll site (check only)

# Builds the site to verify it compiles before Cloudflare Pages builds it.
# Deploying to GitHub Pages is intentionally gone: yuxichau.com is deployed
# by Cloudflare Pages git integration (push to main -> CF builds _site).

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "jekyll-build"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Verify required outputs
        run: |
          test -f _site/index.html
          test -f _site/404.html
          test -f _site/assets/images/favicon.svg